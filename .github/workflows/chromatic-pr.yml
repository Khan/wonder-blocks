name: Chromatic - Pull Request

on:
    pull_request:
        # This allows us to run the workflow on PRs from when they move from draft
        # to non-draft.
        types: [edited, opened, synchronize, reopened]

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    chromatic_changesets:
        # Only run this workflow when the Release PR is opened/created.
        if: startsWith(github.head_ref, 'changeset-release/')
        name: Chromatic - Skip on Release PR (changesets)
        uses: ./.github/workflows/chromatic-build.yml
        with:
            target: "bot"
        secrets:
            projectToken: ${{ secrets.CHROMATIC_APP_CODE }}

    # ------- Regular PRs --------
    chromatic_review:
        # (if) Run this step on regular PRs.
        if: |
            github.actor != 'dependabot[bot]' && github.actor != 'dependabot-preview[bot]' &&
            !startsWith(github.head_ref, 'changeset-release/')
        name: Build on regular PRs
        uses: ./.github/workflows/chromatic-build.yml
        with:
            target: "review"
        secrets:
            projectToken: ${{ secrets.CHROMATIC_APP_CODE }}

    chromatic_review_results:
        # (if) Run this step on regular PRs.
        if: |
            github.actor != 'dependabot[bot]' && github.actor != 'dependabot-preview[bot]' &&
            !startsWith(github.head_ref, 'changeset-release/')
        name: Get results on regular PRs
        needs: chromatic_review
        runs-on: ${{ vars.USE_GITHUB_RUNNERS == 'true' && 'ubuntu-latest' || 'ephemeral-runner' }}
        steps:
            # Create/update PR comment with Chromatic results
            - name: Find existing comment
              uses: peter-evans/find-comment@b30e6a3c0ed37e7c023ccd3f1db5c6c0b0c23aad # v4
              id: fc
              with:
                  issue-number: ${{ github.event.pull_request.number }}
                  comment-author: "github-actions[bot]"
                  body-includes: A new build was pushed to Chromatic!

            - name: Create or update comment
              uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5
              with:
                  comment-id: ${{ steps.fc.outputs.comment-id }}
                  edit-mode: replace
                  issue-number: ${{ github.event.pull_request.number }}
                  body: |
                      # A new build was pushed to Chromatic! :rocket:
                      ${{ needs.chromatic_review.outputs.storybookUrl }}

                      ## Chromatic results:

                      | Metric | Total |
                      |---|---|
                      | Captured snapshots | ${{ needs.chromatic_review.outputs.actualCaptureCount }} |
                      | Tests with visual changes | ${{ needs.chromatic_review.outputs.changeCount }} |
                      | Total stories | ${{ needs.chromatic_review.outputs.specCount }} |
                      | Inherited (not captured) snapshots [TurboSnap] | ${{ needs.chromatic_review.outputs.inheritedCaptureCount }} |
                      | Tests on the build | ${{ needs.chromatic_review.outputs.testCount }} |

    storybook_tests:
        # (if) Run this step on regular PRs.
        if: |
            github.actor != 'dependabot[bot]' && github.actor != 'dependabot-preview[bot]' &&
            !startsWith(github.head_ref, 'changeset-release/')
        name: Run Storybook tests (${{ matrix.theme }})
        needs: chromatic_review
        runs-on: ${{ vars.USE_GITHUB_RUNNERS == 'true' && 'ubuntu-latest' || 'ephemeral-runner' }}
        strategy:
            fail-fast: false
            # Run the a11y suite once per theme in parallel so every story is
            # audited under each theme without tripling wall-clock time.
            matrix:
                theme: [default, thunderblocks, syl-dark]
        steps:
            # Install Playwright system dependencies before checkout/secure-network
            # so we don't need to allowlist Ubuntu package domains.
            - name: Install Playwright dependencies
              timeout-minutes: 5
              run: |
                  sudo apt-get update
                  sudo apt-get install -y fonts-liberation fonts-ipafont-gothic fonts-wqy-zenhei fonts-tlwg-loma-otf fonts-freefont-ttf

            - name: Checking out latest commit
              uses: actions/checkout@v5
            - name: Secure Network
              uses: Khan/actions@secure-network-v1
              timeout-minutes: 5
              with:
                  # registry.npmjs.org: npm package registry for pnpm install
                  # playwright.download.prss.microsoft.com: Playwright browser binary downloads
                  # cdn.playwright.dev: Playwright browser binary CDN
                  # storage.googleapis.com: cdn.playwright.dev returns a 307 redirect to storage.googleapis.com for downloads, so we need to allowlist that too.
                  extra-domains: registry.npmjs.org playwright.download.prss.microsoft.com cdn.playwright.dev storage.googleapis.com

            # Cache and install dependencies
            - name: Install & cache node_modules
              uses: ./.github/actions/shared-node-cache
              timeout-minutes: 5

            - name: Install Playwright browsers
              timeout-minutes: 5
              run: pnpm exec playwright install chromium

            # Build the project
            - name: Generate WB build artifacts
              run: pnpm build

            # TODO(juan): Remove the memory sampler steps once we've collected
            # enough memory data from CI.
            # Samples runner memory in the background so that, if the suite is
            # OOM-killed (exit 137), we can see the runner's limit and which
            # processes (node vs. Chromium) were growing.
            - name: Start memory sampler
              run: |
                  echo "cgroup memory.max: $(cat /sys/fs/cgroup/memory.max 2>/dev/null || echo n/a)"
                  free -m
                  nohup bash -c 'while true; do
                      echo "== $(date -u +%H:%M:%S) cgroup=$(cat /sys/fs/cgroup/memory.current 2>/dev/null || echo n/a)"
                      free -m | sed -n 2p
                      ps -eo rss,comm --sort=-rss | head -6
                      sleep 5
                  done' > "$RUNNER_TEMP/memory.log" 2>&1 &

            # Run the suite in sequential shards so each vitest process (and
            # its Chromium instance) only handles about a third of the story
            # files. Memory grows over the course of a single run and was
            # OOM-killing the runner (exit 137) even with `maxWorkers: 1`.
            - name: Run Storybook tests
              run: pnpm test:storybook:ci
              env:
                  # Audit every story under this matrix theme.
                  VITE_WB_THEME: ${{ matrix.theme }}
                  SB_URL: "${{ needs.chromatic_review.outputs.storybookUrl }}"
                  # Explicitly set the timezone to avoid:
                  # `Invalid time zone specified: ETC/UNKNOWN`
                  TZ: America/Los_Angeles

            - name: Print memory samples
              if: always()
              run: |
                  echo "cgroup memory.peak: $(cat /sys/fs/cgroup/memory.peak 2>/dev/null || echo n/a)"
                  cat "$RUNNER_TEMP/memory.log" 2>/dev/null || echo "No memory samples collected."
