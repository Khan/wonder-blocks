# SPIKE (WB-2480): Evaluate Argos for visual regression testing.
#
# Runs the Storybook Vitest suite (default theme) with Argos screenshots
# enabled, so we can compare wall-clock time and memory against the a11y-only
# `storybook_tests (default)` job in `chromatic-pr.yml`, and inspect the
# screenshots it produces.
#
# Theme/viewport/RTL coverage comes from each story's existing
# `parameters.chromatic.modes`, which `@argos-ci/storybook` reads as a
# fallback, so this produces the same set of snapshots as Chromatic.
#
# Two kinds of jobs run in parallel:
#
# - `deploy`: builds Storybook and publishes it as an Argos deployment (the
#   equivalent of the Storybook that Chromatic hosts for each PR).
#   See: https://argos-ci.com/docs/learn/deployments
# - `screenshots`: the suite split into parallel `--shard`s. Screenshots are
#   ~2.5x slower than the a11y checks alone (~0.7s each, on one worker), so a
#   single job took ~10 min, and one long Vitest/Chromium process is also what
#   OOM-kills the runner (see `test:storybook:ci` in package.json). Argos's
#   parallel mode (`ARGOS_PARALLEL*`) merges the shards back into one build.
#   The shards don't wait for `deploy`, so their "Click to debug" links fall
#   back to localhost; the deployed Storybook is linked from the PR by
#   Argos's `argos-deploy/<project>` status check instead.
#
# Uploading to Argos is opt-in: it only happens when the `ARGOS_TOKEN` secret
# is set. Until then, screenshots are only published as workflow artifacts
# and Storybook isn't deployed.
name: Argos (spike)

on:
    pull_request:
        types: [opened, synchronize, reopened, ready_for_review]
    # Builds on main become the visual baseline (auto-approved by Argos) and
    # are deployed as the production Storybook.
    push:
        branches:
            - main
    workflow_dispatch:
        inputs:
            stories:
                description: "Story file filter passed to vitest (empty = all stories)"
                required: false
                default: ""

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

permissions:
    contents: read
    # Lets Argos authenticate with GitHub Actions OIDC instead of a token,
    # once the Argos GitHub app is installed on the repo.
    id-token: write

env:
    # Secrets can't be used in step `if:` conditions directly.
    HAS_ARGOS_TOKEN: ${{ secrets.ARGOS_TOKEN != '' }}

jobs:
    deploy:
        name: Deploy Storybook to Argos
        runs-on: ${{ vars.USE_GITHUB_RUNNERS == 'true' && 'ubuntu-latest' || 'ephemeral-runner' }}
        steps:
            - name: Checking out latest commit
              if: ${{ env.HAS_ARGOS_TOKEN == 'true' }}
              uses: actions/checkout@v5
            - name: Secure Network
              if: ${{ env.HAS_ARGOS_TOKEN == 'true' }}
              uses: Khan/actions@secure-network-v1
              timeout-minutes: 5
              with:
                  # registry.npmjs.org: npm package registry for pnpm install
                  # api.argos-ci.com: Argos API (deployment creation, auth exchange, finalize)
                  # argos-deployments-production.s3.us-east-1.amazonaws.com: S3 bucket for
                  #   Storybook deployment uploads (from Argos's production config).
                  extra-domains: registry.npmjs.org api.argos-ci.com argos-deployments-production.s3.us-east-1.amazonaws.com

            - name: Install & cache node_modules
              if: ${{ env.HAS_ARGOS_TOKEN == 'true' }}
              uses: ./.github/actions/shared-node-cache
              timeout-minutes: 5

            - name: Generate WB build artifacts
              if: ${{ env.HAS_ARGOS_TOKEN == 'true' }}
              run: pnpm build

            - name: Build Storybook
              if: ${{ env.HAS_ARGOS_TOKEN == 'true' }}
              run: pnpm build:storybook

            - name: Deploy Storybook to Argos
              id: deploy
              if: ${{ env.HAS_ARGOS_TOKEN == 'true' }}
              run: |
                  set -o pipefail
                  # Deploys are previews (a per-deployment URL plus a
                  # per-branch URL that follows the latest deploy). Argos
                  # promotes deploys from the production branch (main by
                  # default) to production on its own, so no `--prod` here.
                  # Argos also posts the deployment URL to the PR as the
                  # `argos-deploy/<project>` status check.
                  # See: https://argos-ci.com/docs/learn/how-to-guides/migrate-to-argos/from-chromatic#migrate-the-published-storybook
                  #
                  # The Argos API rejects zero-byte files ("files.N.size is
                  # Too small"). The Storybook build emits empty esbuild
                  # license files (`sb-addons/*/manager-bundle.js.LEGAL.txt`)
                  # that the browser never requests, so drop them first.
                  find storybook-static -type f -empty -print -delete
                  pnpm exec argos deploy ./storybook-static 2>&1 | tee deploy.log
                  # The CLI prints `✔ Deployed: <url>` once the deployment is
                  # ready; it has no machine-readable output.
                  url=$(sed 's/\x1b\[[0-9;]*m//g' deploy.log | grep -oE 'https://[^ ]+\.argos-ci\.live[^ ]*' | tail -1)
                  if [ -z "$url" ]; then
                      echo "::error title=Argos deploy::Couldn't find the deployment URL in the CLI output"
                      exit 1
                  fi
                  echo "::notice title=Storybook deployed to Argos::${url}"
              env:
                  ARGOS_TOKEN: ${{ secrets.ARGOS_TOKEN }}

            # Emit deploy errors as an annotation: unlike logs, annotations
            # can be read straight from the GitHub API.
            - name: Report deploy failure
              if: ${{ failure() && steps.deploy.outcome == 'failure' }}
              run: |
                  details=$(sed 's/\x1b\[[0-9;]*m//g' deploy.log \
                      | tail -40 \
                      | sed -e 's/%/%25/g' -e 's/\r/%0D/g' \
                      | awk '{printf "%s%%0A", $0}')
                  echo "::error title=Argos deploy failure details::${details}"

    screenshots:
        name: Storybook tests + Argos screenshots (shard ${{ matrix.shard }}/3)
        runs-on: ${{ vars.USE_GITHUB_RUNNERS == 'true' && 'ubuntu-latest' || 'ephemeral-runner' }}
        strategy:
            # Every shard has to upload for Argos to finalize the build.
            fail-fast: false
            matrix:
                shard: [1, 2, 3]
        steps:
            # Same fonts as the a11y matrix, installed before secure-network so
            # we don't need to allowlist Ubuntu package domains.
            - name: Install Playwright dependencies
              timeout-minutes: 5
              run: |
                  sudo apt-get update
                  sudo apt-get install -y fonts-liberation fonts-ipafont-gothic fonts-wqy-zenhei fonts-tlwg-loma-otf fonts-freefont-ttf

            - name: Checking out latest commit
              uses: actions/checkout@v5
              with:
                  # Argos uses git history to find the merge base and pick the
                  # baseline build.
                  fetch-depth: 0
            - name: Secure Network
              uses: Khan/actions@secure-network-v1
              timeout-minutes: 5
              with:
                  # registry.npmjs.org: npm package registry for pnpm install
                  # playwright.download.prss.microsoft.com, cdn.playwright.dev, storage.googleapis.com: Playwright browser downloads
                  # api.argos-ci.com: Argos API (build creation, auth exchange, finalize)
                  # argos-ci-production-us-east-1.s3.us-east-1.amazonaws.com: S3 bucket that the
                  #   presigned screenshot upload URLs returned by the Argos API point to (seen in CI).
                  extra-domains: registry.npmjs.org playwright.download.prss.microsoft.com cdn.playwright.dev storage.googleapis.com api.argos-ci.com argos-ci-production-us-east-1.s3.us-east-1.amazonaws.com

            - name: Install & cache node_modules
              uses: ./.github/actions/shared-node-cache
              timeout-minutes: 5

            - name: Install Playwright browsers
              timeout-minutes: 5
              run: pnpm exec playwright install chromium

            - name: Generate WB build artifacts
              run: pnpm build

            - name: Run Storybook tests with Argos screenshots
              id: vitest
              run: |
                  set -o pipefail
                  start=$(date +%s)
                  # Record the duration even when vitest fails.
                  trap 'echo "seconds=$(( $(date +%s) - start ))" >> "$GITHUB_OUTPUT"' EXIT
                  # STORIES is intentionally unquoted so an empty filter runs
                  # every story file.
                  pnpm exec vitest run --project=storybook --shard=${{ matrix.shard }}/3 $STORIES 2>&1 | tee vitest.log
              env:
                  STORIES: ${{ inputs.stories }}
                  ARGOS_SCREENSHOTS: "true"
                  ARGOS_UPLOAD: ${{ env.HAS_ARGOS_TOKEN }}
                  ARGOS_TOKEN: ${{ secrets.ARGOS_TOKEN }}
                  # Merge the shards into a single Argos build. The nonce has
                  # to be the same for every shard of a run, and different on
                  # a re-run.
                  ARGOS_PARALLEL: "true"
                  ARGOS_PARALLEL_TOTAL: 3
                  ARGOS_PARALLEL_INDEX: ${{ matrix.shard }}
                  ARGOS_PARALLEL_NONCE: ${{ github.run_id }}-${{ github.run_attempt }}
                  VITE_WB_THEME: default
                  # Explicitly set the timezone to avoid:
                  # `Invalid time zone specified: ETC/UNKNOWN`
                  TZ: America/Los_Angeles

            - name: Summarize
              if: always()
              run: |
                  count=$(find screenshots -name '*.png' 2>/dev/null | wc -l)
                  {
                      echo "## Argos spike (shard ${{ matrix.shard }}/3)"
                      echo ""
                      echo "| Metric | Value |"
                      echo "|---|---|"
                      echo "| Screenshots | ${count} |"
                      echo "| Vitest wall-clock | ${{ steps.vitest.outputs.seconds }}s |"
                      echo "| Uploaded to Argos | ${{ env.HAS_ARGOS_TOKEN }} |"
                  } >> "$GITHUB_STEP_SUMMARY"
                  # Also emit the numbers (and, on failure, the error lines) as
                  # annotations: unlike logs and step summaries, those can be
                  # read straight from the GitHub API.
                  echo "::notice title=Argos spike metrics (shard ${{ matrix.shard }}/3)::screenshots=${count} vitest_seconds=${{ steps.vitest.outputs.seconds }}"
                  if [ "${{ steps.vitest.outcome }}" = "failure" ] && [ -f vitest.log ]; then
                      details=$(sed 's/\x1b\[[0-9;]*m//g' vitest.log \
                          | grep -E "Error|FAIL|×|✗|Failed|argos|Argos|Test Files|Tests " \
                          | tail -60 \
                          | sed -e 's/%/%25/g' -e 's/\r/%0D/g' \
                          | awk '{printf "%s%%0A", $0}')
                      echo "::error title=Vitest failure details::${details}"
                  fi

            - name: Upload screenshots
              if: always()
              uses: actions/upload-artifact@v6
              with:
                  name: argos-screenshots-shard-${{ matrix.shard }}
                  path: screenshots
                  retention-days: 7
